<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IoTSensor</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #151b24;
    --line: #22d3ee;
    --grid: #263041;
    --text: #e6edf3;
    --muted: #8b98a9;
    --ok: #34d399;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 20px;
    gap: 14px;
  }
  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 1.15rem; font-weight: 600; margin: 0; letter-spacing: .01em; }
  #status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .85rem; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
  #dot.on { background: var(--ok); }
  main { flex: 1; min-height: 0; background: var(--panel); border-radius: 14px; padding: 16px; }
  canvas { width: 100% !important; height: 100% !important; }
</style>
</head>
<body>
  <header>
    <h1>Jarak Sensor Ultrasonik</h1>
    <div id="status"><span id="dot"></span><span id="statusText">Menghubungkan…</span></div>
  </header>
  <main><canvas id="chart" aria-label="Grafik jarak real-time"></canvas></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script>
    // ====== PENGATURAN (ubah di sini) ======
    const BROKER = "wss://broker.hivemq.com:8884/mqtt";
    const TOPIC  = "iotsensor/jarak";   // samakan dengan topic di ESP32
    const MAX_POINTS = 60;               // jumlah titik yang tampil di grafik
    // =======================================

    const ctx = document.getElementById("chart").getContext("2d");
    const gradient = ctx.createLinearGradient(0, 0, 0, 400);
    gradient.addColorStop(0, "rgba(34,211,238,.35)");
    gradient.addColorStop(1, "rgba(34,211,238,0)");

    const chart = new Chart(ctx, {
      type: "line",
      data: {
        labels: [],
        datasets: [{
          data: [],
          borderColor: "#22d3ee",
          backgroundColor: gradient,
          fill: true,
          tension: 0.35,
          pointRadius: 0,
          pointHoverRadius: 5,
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 250 },
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: c => c.parsed.y + " cm" } }
        },
        scales: {
          x: { ticks: { color: "#8b98a9", maxTicksLimit: 6 }, grid: { color: "#263041" } },
          y: {
            beginAtZero: true,
            title: { display: true, text: "Jarak (cm)", color: "#8b98a9" },
            ticks: { color: "#8b98a9" },
            grid: { color: "#263041" }
          }
        }
      }
    });

    const dot = document.getElementById("dot");
    const statusText = document.getElementById("statusText");
    function setStatus(on, text) {
      dot.classList.toggle("on", on);
      statusText.textContent = text;
    }

    const client = mqtt.connect(BROKER, {
      clientId: "web_" + Math.random().toString(16).slice(2, 10),
      reconnectPeriod: 3000
    });

    client.on("connect", () => {
      client.subscribe(TOPIC);
      setStatus(true, "Terhubung");
    });
    client.on("reconnect", () => setStatus(false, "Menghubungkan ulang…"));
    client.on("close", () => setStatus(false, "Terputus"));
    client.on("error", () => setStatus(false, "Gagal terhubung"));

    client.on("message", (topic, payload) => {
      const value = parseFloat(payload.toString());
      if (isNaN(value)) return;
      const t = new Date().toLocaleTimeString("id-ID");
      chart.data.labels.push(t);
      chart.data.datasets[0].data.push(value);
      if (chart.data.labels.length > MAX_POINTS) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
      }
      chart.update();
    });
  </script>
</body>
</html>
